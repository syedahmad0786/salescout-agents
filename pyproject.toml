[project]
name = "revenue-intelligence-council"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "duckduckgo-search>=6,<9",
  "fastapi>=0.136,<1",
  "httpx>=0.27,<1",
  "langchain-core>=0.3,<2",
  "langchain-groq>=0.2,<2",
  "langchain-ollama>=0.2,<2",
  "langchain-openai>=0.3,<2",
  "langgraph>=0.6,<2",
  "mcp>=2,<3",
  "pydantic>=2.10,<3",
  "rich>=13,<15",
  "streamlit>=1.36,<2",
  "typer>=0.12,<1",
  "uvicorn>=0.34,<1",
